<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet"><style>
@font-face { font-family: "Newsreader"; src: url("newsreader-upright.woff2") format("woff2"); font-weight: 300 400; font-style: normal; }
html, body { margin: 0; background: transparent; }
body { font-optical-sizing: auto; -webkit-font-smoothing: antialiased; display: inline-block; padding: 60px; white-space: nowrap; }
.mark { display: flex; align-items: baseline; gap: 0.4em; font-size: 240px; }
.name { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.015em; line-height: 1; }
.name::after { content: "."; color: #B9975B; }
.sub { font-family: "Hanken Grotesk", sans-serif; font-weight: 400; font-size: 0.53em; letter-spacing: 0; }
.mono { position: relative; font-family: "Newsreader", serif; font-weight: 400; font-size: 720px; line-height: 1; display: inline-block; padding-right: 0.3em; }
.mono .dot { position: absolute; right: 0.02em; bottom: 0.03em; width: 0.19em; height: 0.19em; border-radius: 50%; background: #B9975B; }
